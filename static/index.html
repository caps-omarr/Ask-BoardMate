<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=0">
    <title>Ask BoardMate — TPC Student Housing Assistant</title>
    <link rel="icon" type="image/png" href="/static/askboardmate.png">
    <link rel="apple-touch-icon" href="/static/askboardmate.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&family=Plus+Jakarta+Sans:wght@400;450;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar Backdrop (for mobile drawer) -->
        <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <img src="/static/askboardmate.png" alt="Ask BoardMate Logo" class="brand-circle-logo">
                    <div class="brand-info">
                        <span class="brand-title">Ask BoardMate</span>
                        <span class="brand-subtitle">TPC Student Housing</span>
                    </div>
                </div>
                <button id="desktopSidebarCollapseBtn" class="sidebar-icon-btn collapse-sidebar-btn" aria-label="Collapse sidebar" title="Collapse sidebar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="9" y1="3" x2="9" y2="21"></line>
                        <polyline points="15 9 12 12 15 15"></polyline>
                    </svg>
                </button>
                <button id="sidebarCloseBtn" class="sidebar-icon-btn close-sidebar-btn" aria-label="Close sidebar" title="Close sidebar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <!-- New Chat Primary Action -->
            <div class="sidebar-action-wrap">
                <button id="newChatBtn" class="new-chat-btn" aria-label="Start new chat" title="Start new conversation">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span>New chat</span>
                </button>
            </div>

            <!-- Sidebar Navigation -->
            <nav class="sidebar-nav">
                <ul class="nav-list">
                    <li>
                        <button class="nav-item active" id="currentChatNavItem">
                            <span class="nav-icon">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                                </svg>
                            </span>
                            <span class="nav-label">Current Chat</span>
                            <span class="nav-active-dot"></span>
                        </button>
                    </li>
                    <li>
                        <a href="https://eboardmate.onrender.com/" target="_blank" rel="noopener noreferrer" class="nav-item nav-link-external">
                            <span class="nav-icon">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <line x1="2" y1="12" x2="22" y2="12"></line>
                                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                                </svg>
                            </span>
                            <span class="nav-label">E-BoardMate Portal</span>
                            <svg class="external-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                                <polyline points="15 3 21 3 21 9"></polyline>
                                <line x1="10" y1="14" x2="21" y2="3"></line>
                            </svg>
                        </a>
                    </li>
                </ul>
            </nav>

            <!-- Sidebar Footer: Theme Toggle & Info -->
            <div class="sidebar-footer">
                <button id="themeToggleBtn" class="theme-toggle-row" aria-label="Toggle theme" title="Toggle dark/light mode">
                    <div class="theme-toggle-left">
                        <svg id="themeIconSun" class="theme-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                        <svg id="themeIconMoon" class="theme-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                        <span id="themeLabel" class="theme-label">Dark mode</span>
                    </div>
                </button>
                <div class="sidebar-status-tag">
                    <span class="status-dot"></span>
                    <span>Talibon, Bohol • 15 Accredited</span>
                </div>
            </div>
        </aside>

        <!-- Main Content Area with eBoardMate Gradient Background -->
        <div class="main-content">
            <!-- Desktop Sidebar Expand Toggle Button -->
            <button id="desktopSidebarExpandBtn" class="desktop-sidebar-expand-btn" aria-label="Expand sidebar" title="Expand sidebar">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="9" y1="3" x2="9" y2="21"></line>
                    <polyline points="13 9 16 12 13 15"></polyline>
                </svg>
            </button>

            <!-- Top Mobile / Minimal Bar -->
            <header class="top-nav-bar">
                <button id="sidebarToggleBtn" class="top-nav-btn" aria-label="Toggle sidebar" title="Toggle sidebar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <div class="top-nav-brand">
                    <img src="/static/askboardmate.png" alt="Ask BoardMate" class="top-brand-circle-logo">
                    <span class="top-brand-title">Ask BoardMate</span>
                </div>
                <div class="top-nav-spacer"></div>
            </header>

            <!-- Conversational Stream (Centered Reading Column) -->
            <main class="chat-stream-container">
                <div class="chat-messages" id="chatMessages">
                    <!-- Dynamically populated by chat.js -->
                </div>
            </main>

            <!-- Floating Input Island -->
            <footer class="chat-input-bar">
                <div class="input-container">
                    <form id="chatForm" class="input-form">
                        <textarea 
                            id="messageInput" 
                            rows="1" 
                            placeholder="Reply to Ask-BoardMate or ask about boarding houses..." 
                            autocomplete="off"
                        ></textarea>
                        <button type="submit" id="sendBtn" aria-label="Send message" title="Send message">
                            <svg id="sendIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="19" x2="12" y2="5"></line>
                                <polyline points="5 12 12 5 19 12"></polyline>
                            </svg>
                            <svg id="stopIcon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                                <rect x="5" y="5" width="14" height="14" rx="2"></rect>
                            </svg>
                        </button>
                    </form>
                    <div class="input-disclaimer">
                        Grounded on 15 accredited TPC boarding houses in Talibon, Bohol. Always verify terms with landlords.
                    </div>
                </div>
            </footer>
        </div>
    </div>

    <script src="/static/chat.js"></script>
</body>
</html>
